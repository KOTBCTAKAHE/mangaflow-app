name: mangaflow
description: "MangaFlow — читалка манги, манхвы и маньхуа с русскоязычными источниками."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.7.0
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  path: ^1.9.0
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3
  connectivity_plus: ^6.1.0
  uuid: ^4.5.1
  crypto: ^3.0.6
  wakelock_plus: ^1.2.8
  flutter_local_notifications: ^19.0.0
  workmanager: ^0.10.10
  share_plus: ^11.0.0
  file_picker: ^10.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.4

flutter:
  uses-material-design: true
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
