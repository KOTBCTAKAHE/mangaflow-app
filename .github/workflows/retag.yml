name: Retag
on:
  push:
    paths: ['.github/workflows/retag.yml']
permissions:
  contents: write
jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Move tags to the rewritten commits
        run: |
          while read -r name sha; do
            git tag -f "$name" "$sha"
            git push -f origin "refs/tags/$name"
