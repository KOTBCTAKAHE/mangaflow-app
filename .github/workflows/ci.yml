name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: gradle-${{ runner.os }}-

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Generate platform folders (only missing files are created)
        run: |
          flutter create --org com.mangaflow --project-name mangaflow --platforms android,ios .
          python3 tool/patch_android.py
          git status --short android ios | head -50 || true

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Tests
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libsqlite3-dev >/dev/null
          flutter test --reporter expanded

      - name: Build APK
        run: flutter build apk --release --split-per-abi --dart-define=API_BASE_URL=${{ vars.API_BASE_URL || 'https://api-manga.aniroom.space' }}

      - name: Build universal APK
        run: flutter build apk --release --dart-define=API_BASE_URL=${{ vars.API_BASE_URL || 'https://api-manga.aniroom.space' }}

      - name: Rename APKs
        run: |
          mkdir -p release
          v="${GITHUB_REF_NAME//\//-}"
          cp build/app/outputs/flutter-apk/app-release.apk "release/MangaFlow-$v-universal.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "release/MangaFlow-$v-arm64.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "release/MangaFlow-$v-armv7.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: mangaflow-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: platform-folders
          path: |
            android
            ios
            !android/.gradle
            !android/app/build
            !ios/Pods
          if-no-files-found: ignore

      - name: Publish GitHub Release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: MangaFlow ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            **Какой APK скачать:**
            - `MangaFlow-${{ github.ref_name }}-arm64.apk` — большинство современных телефонов
            - `MangaFlow-${{ github.ref_name }}-armv7.apk` — старые 32-битные устройства
            - `MangaFlow-${{ github.ref_name }}-universal.apk` — если не уверены (больше размер)

            Сервер по умолчанию: https://api-manga.aniroom.space (меняется в Настройках).
          files: |
            release/*.apk
