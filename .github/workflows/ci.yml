name: CI

on:
  push:
    branches: ["**", "!screenshots"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: gradle-${{ runner.os }}-

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Generate platform folders (only missing files are created)
        run: |
          flutter create --org com.mangaflow --project-name mangaflow --platforms android,ios .
          python3 tool/patch_android.py
          git status --short android ios | head -50 || true

      - name: Dependencies
        run: |
          flutter pub get
          grep -A6 -E "^  (path_provider_android|jni):" pubspec.lock | grep -E "^  [a-z_]+:|version" || true
          echo "who pulls jni:"; flutter pub deps --style=compact | grep -E "jni" || true

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Tests
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libsqlite3-dev >/dev/null
          flutter test --reporter expanded

      - name: Release signing key
        id: key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/mangaflow-release.jks"
            echo "MF_KEYSTORE=$RUNNER_TEMP/mangaflow-release.jks" >> "$GITHUB_ENV"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANDROID_KEYSTORE_B64 secret is missing — APK is debug-signed and will NOT be published as a release"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        env:
          MF_KEYSTORE_PASSWORD: 'A9LlW-x-Xiz7XjIJaMa5GErxgY3NHa6R'
        run: flutter build apk --release --split-per-abi --dart-define=API_BASE_URL=${{ vars.API_BASE_URL || 'https://api-manga.aniroom.space' }}

      - name: Build universal APK
        env:
          MF_KEYSTORE_PASSWORD: 'A9LlW-x-Xiz7XjIJaMa5GErxgY3NHa6R'
        run: flutter build apk --release --dart-define=API_BASE_URL=${{ vars.API_BASE_URL || 'https://api-manga.aniroom.space' }}

      - name: Native unit tests (upscaler tiling engine)
        run: cd android && ./gradlew :mangaflow_upscale:testDebugUnitTest --no-daemon -q

      - name: APK contents check (model + ONNX Runtime)
        run: |
          unzip -l build/app/outputs/flutter-apk/app-arm64-v8a-release.apk | grep -E "\.onnx|libonnxruntime" | tee /tmp/apk.txt
          test "$(grep -c '\.onnx' /tmp/apk.txt)" -ge 2
          grep -q libonnxruntime.so /tmp/apk.txt
          ls -la build/app/outputs/flutter-apk/*.apk

      - name: Release version
        id: ver
        run: |
          v="v$(grep -m1 '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')"
          echo "tag=$v" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$v" >/dev/null; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi

      - name: Rename APKs
        run: |
          mkdir -p release
          v="${{ steps.ver.outputs.tag }}"
          cp build/app/outputs/flutter-apk/app-release.apk "release/MangaFlow-$v-universal.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "release/MangaFlow-$v-arm64.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "release/MangaFlow-$v-armv7.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: mangaflow-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: platform-folders
          path: |
            android
            ios
            !android/.gradle
            !android/app/build
            !ios/Pods
          if-no-files-found: ignore

      # Bump `version:` in pubspec.yaml and push to main → a new release is published automatically.
      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' && steps.ver.outputs.exists == 'false' && steps.key.outputs.ok == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: MangaFlow ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          body: |
            **Какой APK скачать:**
            - `MangaFlow-${{ steps.ver.outputs.tag }}-arm64.apk` — большинство современных телефонов
            - `MangaFlow-${{ steps.ver.outputs.tag }}-armv7.apk` — старые 32-битные устройства
            - `MangaFlow-${{ steps.ver.outputs.tag }}-universal.apk` — если не уверены (больше размер)

            Сервер по умолчанию: https://api-manga.aniroom.space (меняется в Настройках).
          files: |
            release/*.apk
