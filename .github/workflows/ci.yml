name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Generate platform folders (only missing files are created)
        run: |
          flutter create --org com.mangaflow --project-name mangaflow --platforms android,ios .
          python3 tool/patch_android.py
          git status --short android ios | head -50 || true

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Tests
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libsqlite3-dev >/dev/null
          flutter test --reporter expanded

      - name: Build APK
        run: flutter build apk --release --split-per-abi --dart-define=API_BASE_URL=${{ vars.API_BASE_URL || 'http://10.0.2.2:8080' }}

      - name: Build universal APK
        run: flutter build apk --release --dart-define=API_BASE_URL=${{ vars.API_BASE_URL || 'http://10.0.2.2:8080' }}

      - uses: actions/upload-artifact@v4
        with:
          name: mangaflow-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: platform-folders
          path: |
            android
            ios
            !android/.gradle
            !android/app/build
            !ios/Pods
          if-no-files-found: ignore
